{% extends "base.html" %}

{% block title %}비밀번호 찾기 - VIBEFASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 auth-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-key fs-2 text-dark"></i>
                    </div>
                    <h3 class="fw-bold mb-2">비밀번호 찾기</h3>
                    <p class="text-muted small">가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>
                </div>

                <!-- URL 파라미터 기반 Bootstrap 5 Alert 메시지 -->
                {% if alert_msg %}
                <div class="alert alert-{{ alert_type }} alert-dismissible fade show shadow-sm mb-4" role="alert">
                    <i class="bi {% if alert_type == 'success' %}bi-check-circle-fill{% elif alert_type == 'warning' %}bi-exclamation-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                    {{ alert_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                </div>
                {% endif %}

                <!-- 비밀번호 재설정 메일 요청 폼 -->
                <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
                    <div class="mb-4">
                        <label for="email" class="form-label small fw-bold text-secondary">가입한 이메일 주소</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input 
                                type="email" 
                                class="form-control border-start-0 ps-1" 
                                id="email" 
                                name="email" 
                                placeholder="name@example.com" 
                                required
                            >
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dark btn-lg rounded-pill fw-bold fs-6 py-2 shadow-sm">
                            재설정 메일 발송
                        </button>
                    </div>

                    <div class="text-center small mt-4">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> 로그인으로 돌아가기
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
