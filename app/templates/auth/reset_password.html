{% extends "base.html" %}

{% block title %}새 비밀번호 설정 - VIBEFASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 auth-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-2">새 비밀번호 설정</h3>
                    <p class="text-muted small">새로운 비밀번호를 입력해주세요.</p>
                </div>

                <!-- URL 파라미터 기반 Bootstrap 5 Alert 메시지 -->
                {% if alert_msg %}
                <div class="alert alert-{{ alert_type }} alert-dismissible fade show shadow-sm mb-4" role="alert">
                    <i class="bi {% if alert_type == 'success' %}bi-check-circle-fill{% elif alert_type == 'warning' %}bi-exclamation-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                    {{ alert_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                </div>
                {% endif %}

                <!-- 새 비밀번호 설정 폼 -->
                <form method="POST" action="{{ url_for('auth.reset_password') }}" novalidate id="resetPasswordForm">
                    <!-- 토큰 / 인증 코드 보존 필드 -->
                    <input type="hidden" name="token_hash" id="token_hash" value="{{ token_hash if token_hash else '' }}">
                    <input type="hidden" name="code" id="code" value="{{ code if code else '' }}">

                    <!-- 새 비밀번호 -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-bold text-secondary">새 비밀번호 (6자 이상)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-1" 
                                id="password" 
                                name="password" 
                                placeholder="새 비밀번호 입력" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 새 비밀번호 확인 -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label small fw-bold text-secondary">새 비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-1" 
                                id="password_confirm" 
                                name="password_confirm" 
                                placeholder="비밀번호 다시 입력" 
                                required
                            >
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dark btn-lg rounded-pill fw-bold fs-6 py-2 shadow-sm">
                            비밀번호 변경 완료
                        </button>
                    </div>

                    <div class="text-center small mt-4">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted">
                            <i class="bi bi-arrow-left me-1"></i> 로그인으로 돌아가기
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Supabase 해시 프래그먼트(#access_token=...)로 진입 시 파라미터 감지 지원
    if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        if (accessToken) {
            // 세션 토큰 정보를 hidden input 또는 추후 요청에 활용
            console.log('Supabase Recovery Token 감지');
        }
    }
</script>
{% endblock %}
