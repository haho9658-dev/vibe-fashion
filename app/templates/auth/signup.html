{% extends "base.html" %}

{% block title %}회원가입 - VIBEFASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- 회원가입 카드 -->
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 auth-card">
                <!-- 브랜드 헤더 -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold tracking-wider mb-2">
                        <span class="text-dark">VIBE</span><span style="color: var(--brand-coral, #ff6b5b);">FASHION</span>
                    </h2>
                    <p class="text-muted small">신규 회원 15% 할인 혜택을 받아보세요</p>
                </div>

                <!-- URL 파라미터 기반 Bootstrap 5 Alert 메시지 -->
                {% if alert_msg %}
                <div class="alert alert-{{ alert_type }} alert-dismissible fade show shadow-sm mb-4" role="alert">
                    <i class="bi {% if alert_type == 'success' %}bi-check-circle-fill{% elif alert_type == 'warning' %}bi-exclamation-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                    {{ alert_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                </div>
                {% endif %}

                <!-- 회원가입 폼 -->
                <form method="POST" action="{{ url_for('auth.signup') }}" novalidate>
                    <!-- 이름/닉네임 입력 -->
                    <div class="mb-3">
                        <label for="name" class="form-label small fw-bold text-secondary">이름 또는 닉네임</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input 
                                type="text" 
                                class="form-control border-start-0 ps-1" 
                                id="name" 
                                name="name" 
                                placeholder="홍길동" 
                                value="{{ name if name else '' }}"
                            >
                        </div>
                    </div>

                    <!-- 이메일 입력 -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold text-secondary">이메일 주소 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input 
                                type="email" 
                                class="form-control border-start-0 ps-1" 
                                id="email" 
                                name="email" 
                                placeholder="name@example.com" 
                                value="{{ email if email else '' }}" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-bold text-secondary">비밀번호 (6자 이상) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-1" 
                                id="password" 
                                name="password" 
                                placeholder="최소 6자 이상의 비밀번호" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label small fw-bold text-secondary">비밀번호 확인 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-1" 
                                id="password_confirm" 
                                name="password_confirm" 
                                placeholder="비밀번호 다시 입력" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 회원가입 버튼 -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-warning btn-lg rounded-pill fw-bold fs-6 py-2 shadow-sm text-dark">
                            회원가입하기
                        </button>
                    </div>

                    <hr class="text-muted opacity-25 my-4">

                    <!-- 로그인 링크 -->
                    <div class="text-center small">
                        <span class="text-muted">이미 계정이 있으신가요?</span>
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none ms-1 text-dark">
                            로그인하기
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
