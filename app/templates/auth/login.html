{% extends "base.html" %}

{% block title %}로그인 - VIBEFASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- 로그인 카드 -->
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 auth-card">
                <!-- 브랜드 헤더 -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold tracking-wider mb-2">
                        <span class="text-dark">VIBE</span><span class="text-coral" style="color: var(--brand-coral, #ff6b5b);">FASHION</span>
                    </h2>
                    <p class="text-muted small">당신의 감각적인 일상을 시작하세요</p>
                </div>

                <!-- URL 파라미터 기반 Bootstrap 5 Alert 메시지 -->
                {% if alert_msg %}
                <div class="alert alert-{{ alert_type }} alert-dismissible fade show shadow-sm mb-4" role="alert">
                    <i class="bi {% if alert_type == 'success' %}bi-check-circle-fill{% elif alert_type == 'warning' %}bi-exclamation-circle-fill{% else %}bi-exclamation-triangle-fill{% endif %} me-2"></i>
                    {{ alert_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
                </div>
                {% endif %}

                <!-- 로그인 폼 -->
                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                    <!-- 로그인 후 원래 이동하려던 URL 보존 -->
                    {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}

                    <!-- 이메일 입력 -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold text-secondary">이메일 주소</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input 
                                type="email" 
                                class="form-control border-start-0 ps-1" 
                                id="email" 
                                name="email" 
                                placeholder="name@example.com" 
                                value="{{ email if email else '' }}" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 비밀번호 입력 & 비밀번호 찾기 링크 -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label small fw-bold text-secondary mb-0">비밀번호</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none text-muted">
                                비밀번호를 잊으셨나요?
                            </a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input 
                                type="password" 
                                class="form-control border-start-0 ps-1" 
                                id="password" 
                                name="password" 
                                placeholder="비밀번호를 입력하세요" 
                                required
                            >
                        </div>
                    </div>

                    <!-- 로그인 버튼 -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dark btn-lg rounded-pill fw-bold fs-6 py-2 shadow-sm auth-btn">
                            로그인
                        </button>
                    </div>

                    <!-- 소셜 로그인 구분선 및 Microsoft 로그인 버튼 -->
                    <div class="position-relative my-4">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">
                            또는
                        </span>
                    </div>

                    <div class="d-grid mb-3">
                        <a href="{{ url_for('auth.microsoft') }}" class="btn btn-outline-dark rounded-pill py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23">
                                <path fill="#f35325" d="M1 1h10v10H1z"/>
                                <path fill="#81bc06" d="M12 1h10v10H12z"/>
                                <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                                <path fill="#ffba08" d="M12 12h10v10H12z"/>
                            </svg>
                            Microsoft 계정으로 로그인
                        </a>
                    </div>

                    <!-- 테스트용 자동 채우기 버튼 (체험용) -->
                    <div class="text-center mb-3">
                        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 small" id="demoFillBtn">
                            <i class="bi bi-magic me-1"></i> 테스트 계정 자동 입력
                        </button>
                    </div>

                    <hr class="text-muted opacity-25 my-4">

                    <!-- 회원가입 링크 -->
                    <div class="text-center small">
                        <span class="text-muted">아직 회원이 아니신가요?</span>
                        <a href="{{ url_for('auth.signup') }}" class="fw-bold text-decoration-none ms-1" style="color: var(--brand-coral, #ff6b5b);">
                            회원가입하기
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // 테스트 계정 정보 자동 입력 스크립트
    document.getElementById('demoFillBtn')?.addEventListener('click', function() {
        document.getElementById('email').value = 'demo@vibefashion.com';
        document.getElementById('password').value = 'password123';
    });
</script>
{% endblock %}
